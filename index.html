<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <title>gemini.AI.upgreaded</title>
  <style>
    :root{--bg:#f7f7f5;--panel:#fff;--text:#202124;--muted:#777b82;--line:#e7e7e3;--blue:#4f78f6;--blue2:#edf2ff;--shadow:0 10px 34px rgba(30,35,50,.08)}
    *{box-sizing:border-box} html,body{height:100%;margin:0} body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);overflow:hidden} button,input,textarea{font:inherit} button{cursor:pointer}
    .shell{height:100%;display:grid;grid-template-columns:280px 1fr}.sidebar{background:#fbfbfa;border-right:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;min-height:0;transition:transform .22s ease}.brand{height:42px;display:flex;align-items:center;gap:10px;padding:0 6px}.brand-mark{width:27px;height:27px;border-radius:9px;background:linear-gradient(135deg,#1a73e8,#8e67ff 70%,#ff805e);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}.brand-name{font-weight:700;letter-spacing:-.2px}.new-chat{margin:14px 0 18px;height:44px;border:1px solid var(--line);border-radius:12px;background:white;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:650;box-shadow:0 2px 8px rgba(20,20,20,.03)}.new-chat:hover{background:#f5f5f2}.nav-label{font-size:11px;color:#999;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:8px 10px}.chat-list{overflow:auto}.chat-item{height:42px;border-radius:9px;display:flex;align-items:center;padding:0 10px;color:#555;font-size:14px}.chat-item.active{background:#eef1f7;color:#333}.sidebar-bottom{margin-top:auto}.profile{height:48px;border-top:1px solid var(--line);display:flex;align-items:end;padding:12px 8px 0;gap:10px}.avatar{width:30px;height:30px;border-radius:50%;background:#ddd;background:linear-gradient(135deg,#dfe7ff,#f5dcfa)}
    .main{min-width:0;height:100%;display:flex;flex-direction:column;position:relative}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid transparent}.drawer{display:none;width:38px;height:38px;border:0;border-radius:10px;background:transparent;font-size:22px}.title-wrap{display:flex;align-items:center;gap:8px}.model-name{font-weight:720}.mode{font-size:12px;color:#777;border:1px solid var(--line);padding:5px 8px;border-radius:999px;background:white}.icon-btn{width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:#666}.icon-btn:hover{background:#ededE9}
    .chat{flex:1;min-height:0;overflow-y:auto;padding:28px 24px 16px}.chat-inner{max-width:780px;margin:auto}.hero{height:calc(100vh - 210px);min-height:390px;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:clamp(28px,4vw,48px);line-height:1.08;letter-spacing:-2px;margin:0 0 14px;max-width:650px}.hero h1 span{color:#9b9da1}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:28px}.suggestion{min-height:78px;text-align:left;border:1px solid var(--line);border-radius:14px;background:white;padding:14px 16px;color:#555;box-shadow:0 3px 12px rgba(30,35,50,.025)}.suggestion b{display:block;color:#333;margin-bottom:6px}.suggestion span{font-size:13px}.message{margin:0 0 24px;animation:in .18s ease}@keyframes in{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}.message.user{display:flex;justify-content:flex-end}.message.user .bubble{max-width:78%;background:#edf0f5;border-radius:18px 18px 4px 18px;padding:12px 15px;white-space:pre-wrap}.message.ai{display:flex;gap:12px}.ai-mark{flex:0 0 28px;width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#1a73e8,#8e67ff 70%,#ff805e)}.answer{min-width:0;max-width:700px;font-size:15px;line-height:1.65}.answer h2,.answer h3{line-height:1.25;margin:.3em 0 .5em}.answer h2{font-size:20px}.answer h3{font-size:16px}.answer ul,.answer ol{padding-left:21px;margin:.45em 0}.answer p{margin:.45em 0}.answer pre{background:#f1f2ef;border-radius:10px;padding:12px;overflow:auto}.answer code{font-family:"SFMono-Regular",Consolas,monospace;font-size:.9em}.answer table{border-collapse:collapse;width:100%;font-size:14px}.answer th,.answer td{border:1px solid var(--line);padding:8px;text-align:left}.typing{display:inline-flex;gap:4px;padding:8px 0}.typing i{width:6px;height:6px;border-radius:50%;background:#aaa;animation:pulse 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes pulse{50%{opacity:.25}}
    .composer-wrap{padding:10px 24px 18px}.composer-box{max-width:780px;margin:auto;border:1px solid var(--line);border-radius:20px;background:white;box-shadow:var(--shadow);padding:8px}.mode-row{height:30px;display:flex;align-items:center;padding:0 4px;gap:5px}.mode-row button{border:0;background:transparent;border-radius:7px;padding:5px 8px;color:#777;font-size:12px}.mode-row button.active{background:var(--blue2);color:#4568ce}.input-row{display:flex;align-items:flex-end}.add-btn{width:38px;height:38px;border:0;border-radius:12px;background:#f2f2ef;font-size:20px;color:#555}.input-row textarea{flex:1;resize:none;border:0;outline:0;padding:9px 10px 7px;max-height:130px;height:42px;line-height:22px;background:transparent}.send-btn{width:38px;height:38px;border:0;border-radius:12px;background:#222;color:white;font-size:18px}.send-btn:disabled{background:#ddd}.disclaimer{text-align:center;font-size:10px;color:#aaa;margin-top:7px}.drawer-overlay{display:none}.studio-panel{position:absolute;right:20px;top:70px;width:300px;background:white;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);z-index:20;display:none}.studio-panel.open{display:block}.studio-panel h3{margin:3px 0 12px}.studio-panel label{display:block;font-size:12px;color:#777;margin:10px 0 5px}.studio-panel input,.studio-panel select{width:100%;height:38px;border:1px solid var(--line);border-radius9px;border-radius:9px;padding:0 9px;background:white}.studio-save{margin-top:12px;width:100%;height:38px;border:0;border-radius9px;border-radius:9px;background:#222;color:white}.attached{display:none;max-width:780px;margin:0 auto 6px;border:1px solid var(--line);background:white;border-radius10px;padding:7px 10px;font-size12px;color:#666}.attached.show{display:flex;justify-content:space-between}.answer-actions{display:flex;gap:4px;margin-top:6px}.answer-actions button{border:0;background:transparent;color:#999;width:30px;height26px;border-radius7px}.answer-actions button:hover{background:#f1f1ed;color:#555}
    @media(max-width:760px){body{overflow:hidden}.shell{grid-template-columns:1fr}.sidebar{position:absolute;z-index:40;width:min(280px,86vw);height:100%;box-shadow:12px 0 35px rgba(20,20,20,.12);transform:translateX(-105%)}.sidebar.open{transform:translateX(0)}.drawer-overlay{position:absolute;inset:0;z-index:35;background:rgba(20,20,20,.18);border:0}.drawer-overlay.show{display:block}.drawer{display:block}.topbar{padding:0 12px;height56px}.chat{padding:18px 14px 10px}.hero{height:calc(100vh - 178px);min-height:300px}.hero h1{font-size:34px;letter-spacing:-1.4px}.suggestions{grid-template-columns:1fr}.suggestion:nth-child(n+3){display:none}.composer-wrap{padding:7px 10px max(8px,env(safe-area-inset-bottom))}.studio-panel{position:fixed;right:8px;left:8px;top:62px;width:auto}.message.user .bubble{max-width:88%}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark"></div><div class="brand-name">gemini.AI.upgreaded</div></div>
      <button class="new-chat" id="newChat"><span>＋</span> New chat</button>
      <div class="nav-label">Recent</div>
      <div class="chat-list" id="chatList"><div class="chat-item active">Today’s conversation</div></div>
      <div class="sidebar-bottom"><div class="profile"><div class="avatar"></div><div><b style="font-size:13px">Guest</b><div style="font-size11px;color:#999;margin-top2px">Local session</div></div></div></div>
    </aside>
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <main class="main">
      <header class="topbar"><button class="drawer" id="drawer" aria-label="Open menu">≡</button><div class="title-wrap"><span class="model-name">Gemini</span><span class="mode" id="modeBadge">Smart</span></div><button class="icon-btn" id="studioBtn" aria-label="Studio">✦</button></header>
      <section class="chat" id="chat"><div class="chat-inner" id="chatInner"><div class="hero" id="hero"><h1>How can I help you <span>today?</span></h1><div class="suggestions">
        <button class="suggestion" data-prompt="Explain a complex topic in a clear, beginner-friendly way"><b>Explain a topic</b><span>Make the complex simple</span></button>
        <button class="suggestion" data-prompt="Help me plan and improve a project from idea to execution"><b>Plan a project</b><span>Turn ideas into clear steps</span></button>
        <button class="suggestion" data-prompt="Write, debug, or review code and explain it carefully"><b>Work with code</b><span>Build, fix, or understand</span></button>
        <button class="suggestion" data-prompt="Create a concise learning study guide with key questions"><b>Make a study guide</b><span>Learn faster with structure</span></button>
      </div></div></div></section>
      <div class="attached" id="attached"><span id="attachedName"></span><button class="icon-btn" id="removeFile" style="width:24px;height24px">×</button></div>
      <div class="composer-wrap"><div class="composer-box"><div class="mode-row"><button class="active" data-mode="Smart">Smart</button><button data-mode="Deep">Deep thinking</button><button data-mode="Creative">Creative</button></div><div class="input-row"><button class="add-btn" id="addBtn" aria-label="Attach file">＋</button><textarea id="input" rows="1" placeholder="Ask anything" aria-label="Message"></textarea><button class="send-btn" id="sendBtn" aria-label="Send">↑</button></div></div><div class="disclaimer" id="clock"></div></div>
      <div class="studio-panel" id="studioPanel"><h3>Studio settings</h3><label for="apiKey">Google AI API key</label><input id="apiKey" type="password" placeholder="AIza... or AQ..." autocomplete="off"><label for="modelSelect">Model</label><select id="modelSelect"><option value="auto">Auto discover</option><option value="gemini-2.5-flash">Gemini 2.5 Flash</option><option value="gemini-2.5-pro">Gemini 2.5 Pro</option><option value="gemini-3-flash-preview">Gemini 3 Flash</option></select><label for="toneSelect">Response tone</label><select id="toneSelect"><option>Clear and helpful</option><option>Concise</option><option>Technical</option><option>Creative</option></select><button class="studio-save" id="studioSave">Save</button></div>
      <input type="file" id="fileInput" accept=".txt,.csv,.json,.md,.js,.py,.html,.xml,.log" hidden>
    </main>
  </div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id); const memory={};
const store={get(k,f=null){try{const v=localStorage.getItem(k);return v===null?f:v}catch(e){return memory[k]??f}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){memory[k]=v;return false}}};
let mode='Smart',attachedText='',attachedName='',busy=false,abort=null,chatHistory=[];
try{mode=store.get('geminiMode','Smart');document.querySelectorAll('.mode-row button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('modeBadge').textContent=mode}catch(e){}
try{$('apiKey').value=store.get('geminiKey','');$('toneSelect').value=store.get('geminiTone','Clear and helpful');$('modelSelect').value=store.get('geminiModel','auto')}catch(e){}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function md(s){let x=esc(s||'');x=x.replace(/```([^\n]*)\n([\s\S]*?)```/g,(m,l,c)=>'<pre><code>'+c+'</code></pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^\* \(.+$/gm,'').replace(/^[-*] (.+)$/gm,'<li>$1</li>').replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>').replace(/^(\d+)\. (.+)$/gm,'<li>$2</li>').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');return '<p>'+x+'</p>'}
function clock(){try{const d=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Istanbul',weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date());$('clock').textContent=d+' · Europe/Istanbul (UTC+3)'}catch(e){$('clock').textContent='Local time'}}clock();setInterval(()=>{try{clock()}catch(e){}},30000);
function autoGrow(){try{const el=$('input');el.style.height='42px';el.style.height=Math.min(el.scrollHeight,130)+'px'}catch(e){}}
$('input').addEventListener('input',()=>{try{autoGrow()}catch(e){}});
$('input').addEventListener('keydown',e=>{try{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}}catch(e){}});
function addMsg(role,html){try{const inner=$('chatInner');const h=$('hero');if(h)h.remove();const el=document.createElement('div');el.className='message '+role;if(role==='user')el.innerHTML='<div class="bubble">'+esc(html)+'</div>';else el.innerHTML='<div class="ai-mark"></div><div class="answer">'+html+'<div class="answer-actions"><button class="copyBtn" title="Copy">⧉</button><button class="ttsBtn" title="Read aloud">◖</button></div></div>';inner.appendChild(el);$('chat').scrollTop=$('chat').scrollHeight}catch(e){}}
function localAnswer(q){const t=q.toLowerCase();if(/(who are you|what are you|what can you do|capabilities)/.test(t))return '<h2>I’m gemini.AI.upgreaded</h2><p>I’m a browser-based assistant that can explain ideas, translate, write and review code, summarize text, plan projects, solve structured problems, and help with game design.</p><ul><li>With an API key, I can use live Gemini models.</li><li>Without a key, I provide reliable built-in guidance.</li><li>I support attached text-based files for local context.</li></ul>';if(/(time|date|today|clock)/.test(t)){try{return '<h2>Current time</h2><p>'+esc(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Istanbul',dateStyle:'full',timeStyle:'medium'}).format(new Date()))+' — Europe/Istanbul (UTC+3).</p>'}catch(e){return '<p>Time is available in the footer.</p>'}}if(/translate|translation|çev|tercüme/.test(t)){const m=q.match(/(.+?)\s+(?:to|into|→|ile)\s+(.+)/i);return '<h2>Translation request</h2><p>Add the exact phrase and target language, for example: <b>“Translate ‘good morning’ into Turkish.”</b></p>'}if(/hello|hi\b|merhaba|selam/.test(t))return '<h2>Hello</h2><p>What would you like to work on? I can begin with a plan, explanation, comparison, or implementation.</p>';if(/(invent|discover|invention|kim icat|icat eden)/.test(t))return '<h2>A useful way to answer invention questions</h2><p>Major inventions often have several contributors, predecessor devices, and independent invention claims. The precise answer depends on the inventor, date, country, and type of invention you mean.</p><p>Please name the invention or add a date/context, and I’ll distinguish established facts from disputed or competing claims.</p>';if(/(code|javascript|python|html|css|bug|debug)/.test(t))return '<h2>Code support</h2><p>Share the language, what you are trying to achieve, the relevant code, and the exact error or expected behavior. I’ll:</p><ol><li>Identify the likely cause.</li><li>Explain the fix clearly.</li><li>Provide a minimal, testable solution.</li></ol>';if(/(plan|project|roadmap)/.test(t))return '<h2>A focused project plan</h2><ol><li><b>Define the outcome:</b> one sentence describing what “done” looks like.</li><li><b>Choose constraints:</b> timeline, audience, budget, and technology.</li><li><b>Break the work:</b> core experience, supporting features, and verification.</li><li><b>Set milestones:</b> build, test, review, and ship.</li></ol><p>Tell me the project idea and constraints for a tailored plan.</p>';return '<h2>Let’s make this specific</h2><p>I can help you analyze, compare, create, translate, or solve this. Share the key details, desired format, and constraints; for a quick answer, use this structure:</p><ul><li><b>Goal:</b> what outcome you want</li><li><b>Context:</b> relevant facts or files</li><li><b>Format:</b> table, steps, code, or summary</li></ul>'}
async function discoverModels(base,key,signal){try{const r=await fetch(base+'/v1beta/models?key='+encodeURIComponent(key),{signal});if(!r.ok)return [];const j=await r.json();return (j.models||[]).filter(x=>Array.isArray(x.supportedGenerationMethods)&&x.supportedGenerationMethods.some(m=>m==='generateContent')).map(x=>x.name.replace(/^models\//,'')).filter(n=>/^gemini/i.test(n)).slice(0,12)}catch(e){return []}}
async function callGemini(q){const key=$('apiKey').value.trim();if(!key)return null;const selected=$('modelSelect').value;const base='https://generativelanguage.googleapis.com';let models=[];try{models=await discoverModels(base,key,abort.signal)}catch(e){models=[]}if(selected!==''&&selected!=='auto')models.unshift(selected);if(!models.length)models=['gemini-2.5-flash','gemini-2.5-pro','gemini-3-flash-preview','gemini-2.0-flash'];models=[...new Set(models)];for(let i=0;i<models.length;i++){const model=models[i];for(let attempt=0;attempt<2;attempt++){try{const controller=new AbortController();const timer=setTimeout(()=>{try{controller.abort()}catch(e){}},35000);abort.signal.addEventListener('abort',()=>{try{controller.abort()}catch(e){}},{once:true});const context=attachedText? '\n\nAttached document context:\n'+attachedText.slice(0,12000):'';const system='You are gemini.AI.upgreaded, a precise, direct, helpful assistant. Answer first, then structure with concise headings, bullets or tables. Tone: '+$('toneSelect').value+'. Be honest and never invent sources.';const body={system_instruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:q+context}]}],generationConfig:{temperature:mode==='Creative'?0.9:0.5,maxOutputTokens:2048}};const r=await fetch(base+'/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});clearTimeout(timer);if(r.ok){const j=await r.json();const text=j?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';if(text)return text}const status=r.status;if(status===404||status===429||status===503){await new Promise(r=>setTimeout(r,attempt?900:350));continue}if(status===400){return null}return null}catch(e){if(abort&&abort.aborted)throw e;await new Promise(r=>setTimeout(r,300));}}}return null}
async function send(){if(busy)return;try{const input=$('input');const q=input.value.trim();if(!q&&!attachedText)return;busy=true;$('sendBtn').disabled=true;abort=new AbortController();addMsg('user',q||('Review attached file: '+attachedName));input.value='';autoGrow();const typing=document.createElement('div');typing.className='message ai';typing.innerHTML='<div class="ai-mark"></div><div class="answer"><span class="typing"><i></i><i></i><i></i></span></div>'; $('chatInner').appendChild(typing);$('chat').scrollTop=$('chat').scrollHeight;let answer='';try{answer=await callGemini(q||'Summarize and explain this attached context')}catch(e){answer=''}typing.remove();if(!answer)answer=localAnswer(q||'attached file');addMsg('ai',md(answer));chatHistory.push({q,a:answer});try{store.set('geminiHistory',JSON.stringify(chatHistory.slice(-20)))}catch(e){}}catch(e){try{const inner=$('chatInner');if(inner)inner.querySelectorAll('.typing').forEach(t=>t.parentElement?.parentElement?.remove())}catch(z){}}finally{busy=false;$('sendBtn').disabled=false;abort=null}}
$('sendBtn').addEventListener('click',()=>{try{send()}catch(e){}});
$('newChat').addEventListener('click',()=>{try{if(busy&&abort)abort.abort();$('chatInner').innerHTML='<div class="hero" id="hero"><h1>How can I help you <span>today?</span></h1></div>';attachedText='';attachedName='';$('attached').classList.remove('show');$('sidebar').classList.remove('open');$('drawerOverlay').classList.remove('show')}catch(e){}});
$('drawer').addEventListener('click',()=>{try{$('sidebar').classList.toggle('open');$('drawerOverlay').classList.toggle('show',$('sidebar').classList.contains('open'))}catch(e){}});$('drawerOverlay').addEventListener('click',()=>{try{$('sidebar').classList.remove('open');$('drawerOverlay').classList.remove('show')}catch(e){}});
$('studioBtn').addEventListener('click',()=>{try{$('studioPanel').classList.toggle('open')}catch(e){}});$('studioSave').addEventListener('click',()=>{try{store.set('geminiKey',$('apiKey').value.trim());store.set('geminiModel',$('modelSelect').value);store.set('geminiTone',$('toneSelect').value);$('studioPanel').classList.remove('open')}catch(e){}});
document.querySelectorAll('.mode-row button').forEach(b=>b.addEventListener('click',()=>{try{document.querySelectorAll('.mode-row button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;$('modeBadge').textContent=mode;store.set('geminiMode',mode)}catch(e){}}));
document.querySelectorAll('.suggestion').forEach(b=>b.addEventListener('click',()=>{try{$('input').value=b.dataset.prompt||'';autoGrow();$('input').focus()}catch(e){}}));
$('addBtn').addEventListener('click',()=>{try{$('fileInput').click()}catch(e){}});$('fileInput').addEventListener('change',async e=>{try{const f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>2*1024*1024){$('attachedName').textContent='File too large (2 MB limit)';$('attached').classList.add('show');return}attachedName=f.name;attachedText=await f.text();$('attachedName').textContent=f.name+' · '+Math.ceil(f.size/1024)+' KB';$('attached').classList.add('show')}catch(e){attachedText='';$('attachedName').textContent='Could not read file';$('attached').classList.add('show')}});$('removeFile').addEventListener('click',()=>{try{attachedText='';attachedName='';$('attached').classList.remove('show');$('fileInput').value=''}catch(e){}});
$('chat').addEventListener('click',e=>{try{const copy=e.target.closest('.copyBtn');if(copy){const ans=copy.closest('.answer');navigator.clipboard?.writeText(ans?.innerText||'').catch?.(()=>{});copy.textContent='✓';setTimeout(()=>copy.textContent='⧉',900)}const tts=e.target.closest('.ttsBtn');if(tts){const ans=tts.closest('.answer');if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(ans?.innerText||'');u.lang='en-US';speechSynthesis.speak(u)}}}catch(e){}});
try{window.addEventListener('resize',()=>{if(document.activeElement===$('input'))document.body.classList.add('keyboard-active');else document.body.classList.remove('keyboard-active')})}catch(e){}
})();
</script>
</body>
</html>
