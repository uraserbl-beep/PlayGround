<!doctype html>
<html lang="en">

<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#202124;--muted:#777b82;--line:#e8e8e5;--accent:#202124;--soft:#f0f0ed;--blue:#3157d5;--shadow:0 12px 40px rgba(30,33,38,.08)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}
.app{height:100dvh;display:grid;grid-template-columns:260px minmax(0,1fr)}
.sidebar{background:#fbfbfa;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;z-index:30;transition:transform .18s ease}.brand{height:44px;display:flex;align-items:center;padding:0 8px;font-weight:760;letter-spacing:-.02em}.brandmark{width:25px;height:25px;border-radius:9px;margin-right:9px;background:linear-gradient(135deg,#5b78dc,#da72a5 54%,#dfac54);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.newchat{border:1px solid var(--line);background:white;border-radius:12px;height:42px;width:100%;text-align:left;padding:0 13px;font-weight:650;display:flex;align-items:center;justify-content:space-between}.newchat span:last-child{color:var(--muted)}
.navlabel{font-size:11px;color:#9a9a96;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:20px 10px 8px}.chatlist{overflow:auto}.chatitem{width:100%;border:0;background:transparent;border-radius:9px;padding:9px 10px;text-align:left;color:#55585d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chatitem:hover,.chatitem.active{background:var(--soft)}
.sidebarfoot{margin-top:auto;padding:8px 4px}.clock{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding:12px 7px 4px}.clock strong{display:block;color:#565961;font-size:13px;margin-top:3px}
.main{min-width:0;display:grid;grid-template-rows:62px minmax(0,1fr) auto}.topbar{display:flex;align-items:center;padding:0 18px;border-bottom:1px solid transparent}.titlewrap{display:flex;align-items:center;gap:8px}.modeltitle{font-weight:720}.chev{color:var(--muted);font-size:12px}.topactions{margin-left:auto;display:flex;align-items:center;gap:6px}.iconbtn{width:38px;height:38px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:#686b70}.iconbtn:hover{background:var(--soft)}.hamburger{display:none}
.workspace{overflow-y:auto;scroll-behavior:smooth}.messages{max-width:820px;margin:0 auto;padding:34px 28px 32px}.empty{min-height:calc(100dvh - 210px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.empty h1{font-family:Georgia,"Times New Roman",serif;font-size:42px;line-height:1.08;margin:0 0 12px;letter-spacing:-.035em}.empty p{color:var(--muted);margin:0 0 26px}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,220px));gap:10px}.suggestion{border:1px solid var(--line);background:rgba(255,255,255,.75);border-radius:14px;padding:13px;text-align:left;color:#55585c;font-size:13px}.suggestion:hover{border-color:#d4d4cf;background:white}
.message{margin:0 0 26px}.userrow{display:flex;justify-content:flex-end}.userbubble{background:#ededE9;max-width:min(680px,82%);padding:11px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap}.answer{line-height:1.68;font-size:15.5px}.answer h1,.answer h2,.answer h3{line-height:1.25;margin:18px 0 8px}.answer h2{font-size:20px}.answer h3{font-size:16px}.answer p{margin:8px 0}.answer ul,.answer ol{padding-left:22px;margin:8px 0}.answer table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}.answer th,.answer td{border:1px solid var(--line);padding:8px;text-align:left}.answer code{background:#f0f0ed;padding:2px 5px;border-radius:5px}.answer pre{overflow:auto;background:#f3f3ef;padding:12px;border-radius:10px}.answer-actions{display:flex;gap:3px;margin-top:8px}.answer-actions .iconbtn{width:30px;height:30px;font-size:14px}.typing{display:flex;gap:5px;padding:8px 0}.typing i{width:6px;height:6px;border-radius:50%;background:#aaa;animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.12s}.typing i:nth-child(3){animation-delay:.24s}@keyframes blink{50%{opacity:.25}}
.composerwrap{padding:8px 22px 18px}.composer{max-width:820px;margin:0 auto;position:relative}.inputbox{border:1px solid #deded9;background:white;border-radius:22px;box-shadow:var(--shadow);padding:8px 8px 7px;transition:border-color .15s}.inputbox:focus-within{border-color:#bfc0ba}.textarea{width:100%;min-height:48px;max-height:150px;resize:none;border:0;outline:0;padding:9px 90px 7px 42px;color:var(--ink);background:transparent}.add,.send,.mic{position:absolute;border:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}.add{left:13px;top:13px;background:#f0f0ed;font-size:21px}.send{right:12px;top:12px;background:var(--accent);color:white}.mic{right:50px;top:12px;background:transparent;color:#777}.disclaimer{text-align:center;font-size:10.5px;color:#a1a29e;margin-top:7px}
.drawer,.studio{position:fixed;z-index:40;top:0;bottom:0;background:white;box-shadow:var(--shadow);transition:transform .18s ease}.drawer{left:0;width:300px;padding:18px;transform:translateX(-105%)}.drawer.open{transform:none}.drawer h3,.studio h3{margin:0 0 14px}.studio{right:0;width:340px;padding:18px;transform:translateX(105%)}.studio.open{transform:none}.overlay{position:fixed;inset:0;background:rgba(30,31,33,.14);z-index:35;display:none}.overlay.show{display:block}.setting{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.setting label{display:flex;justify-content:space-between;font-size:13px}.setting input,.setting select{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:9px;outline:0;background:white}.chiprow{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);background:white;border-radius:999px;padding:7px 10px;font-size:12px}.chip.active{background:#202124;color:white;border-color:#202124}.files{max-height:180px;overflow:auto}.filepill{display:flex;justify-content:space-between;background:#f5f5f2;border-radius:8px;padding:8px;margin:5px 0;font-size:12px}.filepill button{border:0;background:transparent}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,20px);background:#25262a;color:white;border-radius:10px;padding:9px 12px;font-size:12px;opacity:0;pointer-events:none;transition:.18s;z-index:60}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:fixed;height:100%;width:260px;transform:translateX(-105%)}.sidebar.open{transform:none}.hamburger{display:grid}.main{grid-template-rows:54px minmax(0,1fr) auto}.messages{padding:24px 16px}.empty{min-height:calc(100dvh - 190px)}.empty h1{font-size:34px}.suggestions{grid-template-columns:1fr 1fr;width:100%;max-width:420px}.suggestion{padding:11px}.composerwrap{padding:7px 9px 10px}.textarea{padding-right:82px}.studio{width:min(340px,92vw)}.userbubble{max-width:88%}}
@media(max-width:390px){.suggestions{grid-template-columns:1fr}.suggestion:nth-child(n+3){display:none}}
</style>

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brandmark"></span><span>gemini.AI</span></div>
    <button class="newchat" id="newChat"><span>New conversation</span><span>＋</span></button>
    <div class="navlabel">Recent</div>
    <div class="chatlist" id="chatList"></div>
    <div class="sidebarfoot"><div class="clock"><span id="dateText">—</span><strong id="timeText">—</strong></div></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="iconbtn hamburger" id="menuBtn" aria-label="Menu">☰</button>
      <div class="titlewrap"><button class="iconbtn" id="drawerBtn" aria-label="Open drawer" title="History">≡</button><span class="modeltitle">Gemini 2.5</span><span class="chev">⌄</span></div>
      <div class="topactions"><button class="iconbtn" id="studioBtn" aria-label="Studio">⚙</button></div>
    </header>
    <section class="workspace" id="workspace"><div class="messages" id="messages"></div></section>
    <div class="composerwrap">
      <div class="composer"><div class="inputbox">
        <button class="add" id="uploadBtn" aria-label="Attach files">＋</button>
        <textarea class="textarea" id="prompt" rows="1" placeholder="Ask anything" aria-label="Message"></textarea>
        <button class="mic" id="micBtn" aria-label="Voice input">◉</button>
        <button class="send" id="sendBtn" aria-label="Send">↑</button>
      </div></div>
      <div class="disclaimer">AI can make mistakes. Verify important information.</div>
    </div>
  </main>
</div>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer"><h3>Conversations</h3><div id="drawerList"></div></aside>
<aside class="studio" id="studio">
  <h3>Studio</h3>
  <div class="setting"><label><span>Cognitive mode</span></label><div class="chiprow" id="modes"><button class="chip active" data-mode="balanced">Balanced</button><button class="chip" data-mode="deep">Deep</button><button class="chip" data-mode="creative">Creative</button></div></div>
  <div class="setting"><label for="lang">Answer language</label><select id="lang"><option value="auto">Auto</option><option value="tr">Türkçe</option><option value="en">English</option></select></div>
  <div class="setting"><label for="apiKey">Gemini API key</label><input id="apiKey" type="password" placeholder="AIzaSy…"></div>
  <div class="setting"><label for="backupKey">Backup key</label><input id="backupKey" type="password" placeholder="AQ.Ab8RN6…"></div>
  <div class="setting"><label>Attached context</label><div class="files" id="files"></div></div>
</aside>
<input type="file" id="fileInput" accept=".txt,.csv,.json,.md,.js,.py,.html,.xml,.log" multiple hidden>
<div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const $=(id)=>{try{return document.getElementById(id)}catch(e){return null}};
let memoryStorage={getItem:k=>memoryStorage[k]||null,setItem:(k,v)=>{memoryStorage[k]=String(v)}};
function safeStorage(){try{const x='__gemini_test';localStorage.setItem(x,'1');localStorage.removeItem(x);return localStorage}catch(e){return memoryStorage}}
const storage=safeStorage();
let state={conversations:[],active:null,mode:'balanced',files:[],history:[],live:false};
try{state.history=JSON.parse(storage.getItem('gemini_history')||'[]')}catch(e){state.history=[]}
const el={sidebar:$('sidebar'),messages:$('messages'),workspace:$('workspace'),prompt:$('prompt'),studio:$('studio'),drawer:$('drawer'),overlay:$('overlay'),files:$('files')};
function escapeHTML(s=''){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function toast(s){const t=$('toast');if(!t)return;t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1800)}
function save(){try{storage.setItem('gemini_history',JSON.stringify(state.history.slice(-30)))}catch(e){}}
function closePanels(){try{el.drawer?.classList.remove('open');el.studio?.classList.remove('open');el.sidebar?.classList.remove('open');el.overlay?.classList.remove('show')}catch(e){}}
function clock(){try{const d=new Date();const tr=new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(d);const tm=new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZoneName:'short'}).format(d);$('dateText').textContent=tr;$('timeText').textContent=tm}catch(e){}}
function renderEmpty(){el.messages.innerHTML=`<div class="empty"><h1>What can we explore?</h1><p>Reason, create, translate, or build.</p><div class="suggestions"><button class="suggestion" data-q="Summarize my game design notes and suggest 5 improvements">🎮 Improve a game concept</button><button class="suggestion" data-q="Explain a difficult topic step by step">🧠 Explain step by step</button><button class="suggestion" data-q="Translate and explain: Merhaba, nasılsın?">TR ↔ EN translation</button><button class="suggestion" data-q="Create a clean 7-day study plan">📚 Plan a study week</button></div></div>`;document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{el.prompt.value=b.dataset.q||'';send()}));}
function md(s=''){let h=escapeHTML(s);h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^- (.+)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>)/s,'<ul>$1</ul>').replace(/^([1-9]\d?)\. (.+)$/gm,'<li>$1</li>');return h.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>').replace(/^(.+)$/,'<p>$1</p>')}
function addMessage(role,text){const n=document.createElement('div');n.className='message';if(role==='user'){n.innerHTML=`<div class="userrow"><div class="userbubble"></div></div>`;n.querySelector('.userbubble').textContent=text}else{n.innerHTML=`<div class="answer"></div><div class="answer-actions"><button class="iconbtn copy" title="Copy">⧉</button><button class="iconbtn regen" title="Regenerate">↻</button><button class="iconbtn speak" title="Read aloud">◉</button></div>`;n.querySelector('.answer').innerHTML=md(text);n.querySelector('.copy').onclick=()=>copyText(text,n);n.querySelector('.regen').onclick=()=>regenerate(text,n);n.querySelector('.speak').onclick=()=>speak(text)}el.messages.appendChild(n);el.workspace.scrollTop=el.workspace.scrollHeight;return n}
async function copyText(text,n){try{await navigator.clipboard.writeText(text);toast('Copied')}catch(e){toast('Copy unavailable in this browser')}}
function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[#*`]/g,''));u.lang=/[çğıöşü]/i.test(text)?'tr-TR':'en-US';speechSynthesis.speak(u)}catch(e){toast('Speech unavailable')}}
function typing(){const n=document.createElement('div');n.className='message';n.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';el.messages.appendChild(n);el.workspace.scrollTop=el.workspace.scrollHeight;return n}
function localAnswer(q){const s=q.trim();const low=s.toLowerCase();const lang=$('lang')?.value||'auto';const tr=lang==='tr'||(lang==='auto'&&/[çğıöşü]/i.test(s));if(/^(hi|hello|hey|merhaba|selam)/.test(low)){return tr?'Merhaba! Nasıl yardımcı olabilirim?':'Hello! How can I help?'}if(/who are you|what (are )?you|sen (bir |neyin|kimsin)/.test(low)){return tr?'Ben gemini.AI, metin, çeviri, çalışma planları, kod ve oyun tasarımı için çalışan çevrimdışı öncelikli bir asistana benzer bir arayüzüm. Canlı bilgilere veya Gemini API anahtarına bağlanabilirim.':'I’m gemini.AI, an offline-first assistant interface for reasoning, translation, study help, code, and game design. I can also use live sources or an added Gemini API key.'}
if(/translate|translation|çevir|tercüme/.test(low)){const m=s.match(/[:\-]\s*(.+)$/);return tr?'**Çeviri biçimi**\n\nMetni net bir cümlede yazarsanız; iki yönlü çeviri ve kısa kullanım notları verebilirim.'+(m?'\n\n“'+escapeHTML(m[1])+'” için bağlam gerekli.':''):'**Translation**\n\nFor a precise result, include the complete phrase and the intended context. I can provide both the translation and a brief usage note.'}
if(/inven|kim icat|who invented|buldu|icad/.test(low)){return tr?'Bu soruyu cevaplamadan önce icadın kesin adını ve yıl aralığını belirtmek önemli. Birçok teknoloji tek bir mucidin değil, birden fazla katkıcının eseridir. Daha ayrıntılı ve tarihsiz bir sonuç için konuyu yazın.':'This depends on the invention in question. Many technologies have several contributors rather than one inventor. Add the invention’s name for a concise timeline and attribution.'}
if(/(game|oyun).*(improv|geliştir|tasarım|mechanic|mekanik)|(improv|geliştir).*(game|oyun)/.test(low)){return tr?'**Oyun konsepti için güçlü bir başlangıç**\n\n- **Ana döngü:** Oyuncunun hangi açık riskli kararları tekrar etmesi?\n- **Anlamlı ilerleme:** Güç, bilgi ve alanı nasıl değiştiriyor?\n- **Geri bildirim:** Başarıyı ve hatayı 250 ms içinde hissedilebilir hale getirin.\n- **Tekil ayırt edici:** Oyunun yalnızca sizin konseptinizde çalışan tek bir mekanik belirleyin.\n- **İlk içerik testi:** 5 oyuncudan 10 dakikalık tek seviyeyi test edin.':'**A strong game-concept starting point**\n\n- **Core loop:** What repeated, high-risk decision does the player make?\n- **Meaningful progression:** How do power, knowledge, or space change?\n- **Feedback:** Make success and failure legible within roughly 250 ms.\n- **Distinctive mechanic:** Define one mechanic that is specific to this concept.\n- **First playtest:** Test one 10-minute level with five players.'}
if(/study plan|7-day|çalışma plan|ders plan/.test(low)){return tr?'**7 günlük çalışma planı**\n\n- **1. Gün:** Hedefleri ve zayıf noktaları belirle.\n- **2–3. Gün:** Temel kavramları kısa oturumlarla öğren.\n- **4. Gün:** Konuyu hatırlamadan uygula.\n- **5. Gün:** Karışık sorularla sınav yap.\n- **6. Gün:** Hataları düzelt ve tekrar et.\n- **7. Gün:** Tam deneme; sonuçları gözden geçir.':'**7-day study plan**\n\n- **Day 1:** Define goals and weak areas.\n- **Days 2–3:** Learn fundamentals in short sessions.\n- **Day 4:** Practice without notes.\n- **Day 5:** Use mixed review questions.\n- **Day 6:** Correct and repeat mistakes.\n- **Day 7:** Take a full practice test and review results.'}
if(/\d/.test(s)&&/[+×*/−-]|(?:what is|calculate|hesapla)/.test(low)){const expr=s.match(/-?[\d.]+\s*[+*/-]\s*-?[\d.]+/);if(expr){try{if(!/[a-z]/i.test(expr[0])&&/^[\d.+*/() -]+$/.test(expr[0])){const v=Function('"use strict";return ('+expr[0].replace(/×/g,'*').replace(/−/g,'-')+')')();return tr?'Sonuç: **'+v+'**':'Result: **'+v+'**'}}catch(e){}}}
const relevant=state.files.map(f=>f.text).join('\n').slice(0,7000);const ctx=relevant?`\n\n**Attached context considered:**\n${relevant.slice(0,1200)}`:'';return tr?'Sorunu en anlaşılır biçimde aldım: “'+escapeHTML(s)+'”'+ctx+'\n\nDetaylı bir plan için hedef, kapsam, kısıtlar ve beklenen sonucu belirtin.':'I understand the request as: “'+escapeHTML(s)+'”'+ctx+'\n\nFor the most precise response, the key dimensions are goal, scope, constraints, and expected format.'}
async function fetchJSON(url,options={},timeout=12000){let ctl;try{ctl=new AbortController();options.signal=ctl.signal;const timer=setTimeout(()=>{try{ctl.abort()}catch(e){}},timeout);try{const r=await fetch(url,options);clearTimeout(timer);if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}catch(e){clearTimeout(timer);throw e}}catch(e){throw e}}
async function discoverModels(key){try{const d=await fetchJSON('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(key),{},10000);return (d.models||[]).filter(m=>m.supportedGenerationMethods?.includes('generateContent')).map(m=>m.name.replace(/^models\//,'')).slice(0,8)}catch(e){return []}}
async function callGemini(q){const key1=$('apiKey')?.value.trim();const key2=$('backupKey')?.value.trim();if(!key1&&!key2)return null;const keys=[key1,key2].filter(Boolean);let models=['gemini-2.5-flash','gemini-2.0-flash','gemini-1.5-flash'];for(const key of keys){const discovered=await discoverModels(key);if(discovered.length)models=[...new Set([...discovered,...models])];for(const model of models){try{const context=state.files.map(f=>'FILE '+f.name+':\n'+f.text.slice(0,3000)).join('\n\n');const body={contents:[{role:'user',parts:[{text:(context?'Context:\n'+context+'\n\n':'')+q}]}],generationConfig:{temperature:state.mode==='creative'?0.9:state.mode==='deep'?0.35:0.65}};const r=await fetchJSON('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)},25000);return r.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||null}catch(e){if(!/HTTP (429|503|404)/.test(e.message))continue}}}return null}
async function send(){const q=(el.prompt?.value||'').trim();if(!q)return;el.prompt.value='';el.prompt.style.height='';el.messages.querySelector('.empty')?.remove();addMessage('user',q);const typingEl=typing();let answer='';try{answer=await callGemini(q)}catch(e){answer=null}if(!answer)answer=localAnswer(q);typingEl.remove();const n=addMessage('assistant',answer);state.history.push({q,a:answer,t:Date.now()});save()}
function regenerate(text,n){try{const last=state.history[state.history.length-1];if(last&&n){n.querySelector('.answer').innerHTML='<div class="typing"><i></i><i></i><i></i></div>';setTimeout(()=>n.querySelector('.answer').innerHTML=md(last.a),250)}}catch(e){toast('Could not regenerate')}}
async function attachFiles(list){const allowed=/\.(txt|csv|json|md|js|py|html|xml|log)$/i;for(const file of Array.from(list||[])){if(!allowed.test(file.name)){toast('Unsupported file');continue}try{const text=await file.text();const chunks=[];for(let i=0;i<text.length;i+=3000)chunks.push(text.slice(i,i+3000));state.files.push({name:file.name,text:chunks.join('\n')});}catch(e){toast('Could not read '+file.name)}}renderFiles()}
function renderFiles(){if(!el.files)return;if(!state.files.length){el.files.innerHTML='<span style="color:#999;font-size:12px">No files attached</span>';return}el.files.innerHTML=state.files.map((f,i)=>`<div class="filepill"><span>${escapeHTML(f.name)}</span><button data-rm="${i}" aria-label="Remove">×</button></div>`).join('');el.files.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{state.files.splice(Number(b.dataset.rm),1);renderFiles()}))}
function bind(){try{ $('newChat')?.addEventListener('click',()=>{el.messages.innerHTML='';renderEmpty();closePanels()});$('menuBtn')?.addEventListener('click',()=>{el.sidebar.classList.toggle('open');el.overlay.classList.toggle('show')});$('drawerBtn')?.addEventListener('click',()=>{el.drawer.classList.toggle('open');el.overlay.classList.toggle('show')});$('studioBtn')?.addEventListener('click',()=>{el.studio.classList.toggle('open');el.overlay.classList.toggle('show')});el.overlay?.addEventListener('click',closePanels);$('uploadBtn')?.addEventListener('click',()=>{$('fileInput')?.click()});$('fileInput')?.addEventListener('change',e=>attachFiles(e.target.files));$('sendBtn')?.addEventListener('click',send);el.prompt?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});el.prompt?.addEventListener('input',()=>{el.prompt.style.height='auto';el.prompt.style.height=Math.min(el.prompt.scrollHeight,150)+'px'});$('micBtn')?.addEventListener('click',()=>{try{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voice input unavailable');const r=new R();r.lang=$('lang')?.value==='tr'?'tr-TR':'en-US';r.onresult=e=>{el.prompt.value=e.results[0][0].transcript};r.onerror=()=>toast('Voice input stopped');r.start()}catch(e){toast('Voice input unavailable')}});document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.mode=b.dataset.mode||'balanced'}));}catch(e){toast('A control could not be initialized')}
try{for(const id of ['apiKey','backupKey','lang']){const elx=$(id);elx?.addEventListener('change',()=>{try{storage.setItem('gemini_'+id,elx.value)}catch(e){}});const saved=storage.getItem('gemini_'+id);if(saved!==null&&elx)elx.value=saved}}catch(e){}
try{window.addEventListener('resize',()=>{if(document.activeElement?.matches('textarea'))document.body.classList.add('typing-state');else document.body.classList.remove('typing-state')})}catch(e){}} 

try{renderEmpty();renderFiles();bind();clock();setInterval(()=>{try{clock()}catch(e){}},1000);}catch(e){}
})();
</script>
</body>
</html>
