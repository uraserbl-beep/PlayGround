<script>
(()=>{'use strict';
const syncViewportHeight=()=>document.documentElement.style.setProperty('--app-height',Math.round(window.visualViewport?.height||window.innerHeight)+'px');
syncViewportHeight();window.addEventListener('resize',syncViewportHeight);window.visualViewport?.addEventListener('resize',syncViewportHeight);
const $=id=>document.getElementById(id); const memory={};
const store={get(k,f=null){try{const v=localStorage.getItem(k);return v===null?f:v}catch(e){return memory[k]??f}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){memory[k]=v;return false}}};
let mode='Smart',attachedText='',attachedName='',busy=false,abort=null,chatHistory=[],lastSearchContext=null;
function applyAppearance(){
  const font=store.get('foverseFont','modern'),bubble=store.get('foverseBubble','rounded'),theme=store.get('foverseTheme','slate'),size=store.get('foverseSize','15');
  document.body.dataset.font=font;document.body.dataset.bubble=bubble;document.body.dataset.theme=theme;
  document.documentElement.style.setProperty('--bubble-size',size+'px');
  const fontSelect=$('fontSelect'),bubbleSelect=$('bubbleSelect'),themeSelect=$('themeSelect'),sizeSelect=$('sizeSelect');
  if(fontSelect)fontSelect.value=font;if(bubbleSelect)bubbleSelect.value=bubble;if(themeSelect)themeSelect.value=theme;if(sizeSelect)sizeSelect.value=size;
}
applyAppearance();
function applyWallpaper(){
  const enabled=store.get('foverseWallpaper','on')==='on';const video=$('liveWallpaper'),button=$('wallpaperToggle');
  video.style.display=enabled?'block':'none';button.classList.toggle('off',!enabled);button.setAttribute('aria-pressed',String(enabled));button.textContent=enabled?'◉':'○';
  if(enabled)video.play().catch(()=>{});else video.pause();
}
applyWallpaper();
try{mode=store.get('geminiMode','Smart');document.querySelectorAll('.mode-row button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('modeBadge').textContent=mode}catch(e){}
try{$('apiKey').value=store.get('geminiKey','');$('toneSelect').value=store.get('geminiTone','Clear and helpful');$('modelSelect').value=store.get('geminiModel','auto')}catch(e){}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cleanAnswerText(s){
  let text=String(s||'');
  text=text.replace(/==+\s*([^=\n]+?)\s*==+/g,'$1');
  const blocked=/HTTP\/[\d.]+|\b(?:RESOURCE_EXHAUSTED|PERMISSION_DENIED|INVALID_ARGUMENT|NOT_FOUND)\b|status(?: code)?\s*[:=]?\s*\d{3}|api[_ -]?key|exception\s*:|stack trace|traceback|request failed|another api key|provide (?:a|another) api key|enter (?:a|another) api key|invalid api key|quota exceeded|too many requests/i;
  text=text.split('\n').filter(line=>{
    const t=line.trim();
    if(blocked.test(t)) return false;
    if(/^at\s+/.test(t)||/^\^+/.test(t)) return false;
    if(/^(error|code|message)\s*[:=]/i.test(t)) return false;
    return true;
  }).join('\n');

function shouldSearch(query){
  const q=normText(query);

  if(window.FoVerseNewsIntent?.isNewsIntent(query))return true;

  if(currentShort)return true;
  // Do not search for conversation, creative fiction, general reasoning, or questions already answered by the supplied context.
  if(/\b(hikaye|hikaye yaz|senaryo|kurgu|creative|fiction|story|poem|siir|sohbet|chat|genel mantik|genel mantık|acikla|anlat|neden|nasıl|nasil)\b/i.test(q)&&!/\b(haber|guncel|son durum|bugun|dun|bu hafta|gecen hafta|fiyat|hava durumu|borsa|score|skor|surum|version|release|kaynak|dogrula|doğrula|araştır|araştırma|ara|google|kontrol et)\b/i.test(q))return false;
  const explicit=/\b(arastir|arastirma|araştır|araştırma|google'da bul|google da bul|kontrol et|kaynak getir|kaynaklar|get source|sources|find online|search the web|look up)\b/i.test(q);
  const changing=/\b(guncel|son durum|haber|news|latest|current|today|today's|now|recent|release|surum|version|fiyat|price|weather|hava durumu|borsa|stock|skor|score|202[0-9]|bugun|dun|yarin|bu hafta|gecen hafta|su an|son dakika|teknik dokuman|technical documentation|api docs|documentation|dokumantasyon)\b/i.test(q);
  const timeSensitive=/what(?:'s| is) the date|what day is it|what time is it|current time|bugun ayin kaci|bugun tarih ne|hangi gun|saat kac|saat su an kac/i.test(q);
  return explicit||changing||timeSensitive;
}
function resolveNumberedNewsFollowup(query){
  const q=String(query||'');
  const numberMatch=q.match(/(?:^|\b)([1-9]\d?)\.?\s*(?:haber(?:i|in|leri)?|madd(?:e|esi)|numaralı\s+haber)/i);
  const n=numberMatch?.[1]||null;
  const detail=window.FoVerseNewsIntent?.isNewsDetailRequest(q);
  if(!n&&!detail)return '';
  const cards=[...document.querySelectorAll('#chatInner .message.ai')];
  if(n){
    for(let i=cards.length-1;i>=0;i--){
      const text=cards[i].innerText||cards[i].textContent||'';
      const lines=text.split(/\r?\n/).map(line=>line.trim()).filter(Boolean);
      const found=lines.find(line=>new RegExp('^'+n+'[.)]\\s+.+$','i').test(line));
      if(found){
        const title=found.replace(new RegExp('^'+n+'[.)]\\s*','i'),'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,220);
        if(title)return 'Haber detayı '+title;
      }
      const inline=text.match(new RegExp('(?:^|\\n)\\s*'+n+'[.)]\\s*(.+?)(?=\\n\\s*[1-9]\d*[.)]\\s|$)','is'));
      if(inline){
        const title=inline[1].replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,220);
        if(title)return 'Haber detayı '+title;
      }
    }
  }
  if(detail)return window.FoVerseNewsIntent?.detailSearchQuery(q)||q;
  return '';
}
function buildSearchQuery(query){
  const q=String(query||'').replace(/\s+/g,' ').trim();
  if(!q)return '';
  if(window.FoVerseNewsIntent?.isNewsDetailRequest(q))return window.FoVerseNewsIntent.detailSearchQuery(q)||q;
  const newsQuery=window.FoVerseNewsIntent?.searchQuery(q);
  if(newsQuery)return newsQuery;
  const normalized=q.toLocaleLowerCase('tr-TR').replace(/[?!.]+$/,'').trim();
  if(/^(gündemde ne var|gundemde ne var|gündem|gundem|günse|gunse|bugün neler oldu|bugun neler oldu|son gelişmeler|son gelismeler|haberler|güncel haberler|guncel haberler)$/.test(normalized))return 'Türkiye ve dünya gündem son dakika haberleri';
  let out=q
    .replace(/^(lütfen\s+|lutfen\s+|please\s+|can you\s+|could you\s+)/i,'')
    .replace(/\b(arastir|araştır|araştırma|google'da bul|google da bul|kontrol et|kaynak getir|search the web|look up|get sources?)\b/gi,'')
    .replace(/[?!.]+$/,'')
    .replace(/\s+/g,' ').trim();
  const tokens=out.split(/\s+/).filter(Boolean);
  if(tokens.length>12)out=tokens.slice(0,12).join(' ');
  return out.slice(0,500);
}
